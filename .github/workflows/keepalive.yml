# Houdt het gratis Supabase-project actief (twee keer per week een klein seintje).
name: Supabase actief houden
on:
  schedule:
    - cron: '23 7 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          URL=$(sed -n "s/.*SUPABASE_URL = '\(.*\)'.*/\1/p" config.js)
          KEY=$(sed -n "s/.*SUPABASE_ANON_KEY = '\(.*\)'.*/\1/p" config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}'
